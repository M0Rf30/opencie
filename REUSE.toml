version = 1

# Third-party fonts (SIL Open Font License 1.1); license texts are bundled alongside.
[[annotations]]
path = ["assets/fonts/Inter-*.ttf", "assets/fonts/Inter-OFL.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/JetBrainsMono-*.ttf", "assets/fonts/JetBrainsMono-OFL.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# C++ runtime from the Android NDK (LLVM libc++), copied in by CI.
[[annotations]]
path = "android/app/src/main/jniLibs/*/libc++_shared.so"
precedence = "aggregate"
SPDX-FileCopyrightText = "LLVM Project contributors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Flutter-generated or unmodified Flutter-template files that cannot carry comments.
[[annotations]]
path = [
  "linux/flutter/generated_plugin_registrant.cc",
  "linux/flutter/generated_plugin_registrant.h",
  "linux/flutter/generated_plugins.cmake",
  "windows/flutter/generated_plugin_registrant.cc",
  "windows/flutter/generated_plugin_registrant.h",
  "windows/flutter/generated_plugins.cmake",
  "macos/Flutter/GeneratedPluginRegistrant.swift",
  "macos/Flutter/Flutter-Debug.xcconfig",
  "macos/Flutter/Flutter-Release.xcconfig",
  ".metadata",
  "macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/IDEWorkspaceChecks.plist",
  "macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme",
  "macos/Runner.xcworkspace/contents.xcworkspacedata",
  "macos/Runner.xcworkspace/xcshareddata/IDEWorkspaceChecks.plist",
  "macos/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json",
  "macos/Runner/Base.lproj/MainMenu.xib",
  "macos/Runner/Configs/*.xcconfig",
  "macos/Runner/Info.plist",
  "windows/runner/Runner.rc",
  "windows/runner/runner.exe.manifest",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 The Flutter Authors"
SPDX-License-Identifier = "BSD-3-Clause"

# Flutter-template files modified by this project (bundled native library,
# entitlements, etc.); no in-file comments possible.
[[annotations]]
path = [
  "macos/Runner.xcodeproj/project.pbxproj",
  "macos/Runner/*.entitlements",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2014 The Flutter Authors", "2026 Gianluca Boiano"]
SPDX-License-Identifier = "BSD-3-Clause AND GPL-3.0-or-later"

# App icons rendered from assets/branding/icon.svg by tools/render_icons.sh.
[[annotations]]
path = "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_*.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gianluca Boiano"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Binary assets, JSON/ARB data and other files that cannot carry comments.
[[annotations]]
path = [
  ".fvmrc",
  "assets/branding/icon.svg",
  "docs/screenshots/*.png",
  "docs/research/*.json",
  "flatpak/flathub/flathub.json",
  "flatpak/flathub/*.png",
  "lib/core/l10n/*.arb",
  "linux/runner/resources/*.png",
  "android/app/src/main/res/mipmap-*/ic_launcher*.png",
  "windows/runner/resources/app_icon.ico",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gianluca Boiano"
SPDX-License-Identifier = "GPL-3.0-or-later"
