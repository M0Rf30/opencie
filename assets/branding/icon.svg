<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenCIE app icon.
  128x128 viewBox, rounded square (rx=28). All platform launcher icons,
  .icns, .ico and Inno Setup BMPs derive from this file via
  tools/render_icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123A6B"/>
      <stop offset="1" stop-color="#071528"/>
    </linearGradient>
    <radialGradient id="glow" cx="40" cy="30" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FA8E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5FA8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="72" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9F2FB"/>
      <stop offset="1" stop-color="#B9D3EC"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.6" stop-color="#E0AE3E"/>
      <stop offset="1" stop-color="#B07F22"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="72" height="48" rx="7"/>
    </clipPath>
  </defs>

  <!-- Backdrop -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>

  <!-- Contactless waves, clear of the card -->
  <g fill="none" stroke="#FFD866" stroke-linecap="round" transform="translate(3 0)">
    <path d="M 88 46 A 18 18 0 0 1 88 70" stroke-width="5"/>
    <path d="M 98 38 A 30 30 0 0 1 98 78" stroke-width="5" opacity="0.7"/>
    <path d="M 108 30 A 42 42 0 0 1 108 86" stroke-width="5" opacity="0.4"/>
  </g>

  <!-- Card -->
  <g transform="translate(14 40) rotate(-8 36 24)">
    <rect x="1.5" y="4" width="72" height="48" rx="7" fill="#000" opacity="0.35"/>
    <g clip-path="url(#cardClip)">
      <rect width="72" height="48" fill="url(#card)"/>
      <!-- Tricolour band -->
      <rect x="0" y="0" width="24" height="7" fill="#009246"/>
      <rect x="24" y="0" width="24" height="7" fill="#FFFFFF"/>
      <rect x="48" y="0" width="24" height="7" fill="#CE2B37"/>
      <!-- MRZ lines -->
      <rect x="8" y="37" width="56" height="2.6" rx="1.3" fill="#1F4E82" opacity="0.45"/>
      <rect x="8" y="42" width="40" height="2.6" rx="1.3" fill="#1F4E82" opacity="0.45"/>
    </g>
    <!-- Chip -->
    <g transform="translate(8 14)">
      <rect width="20" height="16" rx="3" fill="url(#chip)"/>
      <g stroke="#8A6116" stroke-width="0.9" fill="none">
        <line x1="0" y1="5.3" x2="20" y2="5.3"/>
        <line x1="0" y1="10.7" x2="20" y2="10.7"/>
        <line x1="10" y1="0" x2="10" y2="16"/>
      </g>
    </g>
    <!-- Portrait -->
    <g transform="translate(48 13)" fill="#1F4E82" opacity="0.75">
      <circle cx="7" cy="5" r="4"/>
      <path d="M 0 18 Q 0 11 7 11 Q 14 11 14 18 Z"/>
    </g>
  </g>
</svg>
