name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCIE_PKCS11_VERSION: "1.0.12"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache/hosted
          key: pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-

      - run: flutter pub get

      - run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter test --exclude-tags network --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache/hosted
          key: pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-

      - name: Install Linux build dependencies
        run: >
          sudo apt update &&
          sudo apt install -y
          ninja-build
          libgtk-3-dev
          libblkid-dev
          liblzma-dev
          libsecret-1-dev

      - name: Cache libopencie-pkcs11.so
        id: cache-pkcs11-linux
        uses: actions/cache@v6
        with:
          path: libopencie-pkcs11.so
          key: pkcs11-linux-x86_64-${{ env.OPENCIE_PKCS11_VERSION }}

      - name: Download libopencie-pkcs11.so
        if: steps.cache-pkcs11-linux.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # TODO: verify native lib checksum once upstream publishes SHA256SUMS
          gh release download "${{ env.OPENCIE_PKCS11_VERSION }}" \
            --repo M0Rf30/opencie-pkcs11 \
            --pattern '*linux-x86_64.so' \
            --dir pkcs11-dist
          so="$(ls pkcs11-dist/*linux-x86_64.so 2>/dev/null | head -1)"
          if [ -z "$so" ]; then
            echo "::error::libopencie-pkcs11 linux-x86_64 .so not found in M0Rf30/opencie-pkcs11 releases"
            exit 1
          fi
          cp "$so" libopencie-pkcs11.so
          echo "pkcs11 lib: $(ls -lh libopencie-pkcs11.so)"

      - name: Set PKCS11 lib path (linux)
        run: echo "OPENCIE_PKCS11_LIB=$(pwd)/libopencie-pkcs11.so" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Verify PKCS#11 library was bundled
        run: |
          test -f build/linux/x64/release/bundle/lib/libopencie-pkcs11.so \
            || { echo "::error::libopencie-pkcs11.so missing from Linux bundle"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: opencie-linux-x86_64
          path: build/linux/x64/release/bundle/

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-build-log
          path: build/linux/x64/release/

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache/hosted
          key: pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Sync libopencie-pkcs11 jniLibs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync-jnilibs.sh "${{ env.OPENCIE_PKCS11_VERSION }}"

      - run: flutter pub get

      - name: Decode release keystore
        # Optional: when KEYSTORE_BASE64 is configured, the release APK/AAB
        # are signed with the upload keystore. Otherwise the build falls back
        # to debug signing (still produces installable artifacts, but unsuitable
        # for stores like IzzyOnDroid / Play).
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Configuring release signing keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > android/opencie.keystore
            cat > android/key.properties <<EOF
          storeFile=opencie.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          else
            echo "::warning::No KEYSTORE_BASE64 secret set — release build will use debug signing"
          fi

      - name: flutter build apk
        run: flutter build apk --release

      - name: flutter build appbundle
        run: flutter build appbundle --release

      - name: Stage Android artifacts
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          # Use plain version label when not building from a tag
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="snapshot"
          fi
          mkdir -p build/apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/apk/opencie-${TAG}-android-arm64-v8a.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "build/apk/opencie-${TAG}-android.aab"
          ls -lh build/apk/

      - uses: actions/upload-artifact@v7
        with:
          name: opencie-android-arm64-v8a
          path: build/apk/opencie-*-android-arm64-v8a.apk

      - uses: actions/upload-artifact@v7
        with:
          name: opencie-android-aab
          path: build/apk/opencie-*-android.aab

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-build-log
          path: build/app/outputs/

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache/hosted
          key: pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-

      - name: Cache libopencie-pkcs11 windows
        id: cache-pkcs11-windows
        uses: actions/cache@v6
        with:
          path: |
            libopencie-pkcs11.dll
            pkcs11-runtime
          key: pkcs11-windows-x86_64-${{ env.OPENCIE_PKCS11_VERSION }}

      - name: Download libopencie-pkcs11.dll and runtime deps
        if: steps.cache-pkcs11-windows.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # TODO: verify native lib checksum once upstream publishes SHA256SUMS
          # Main DLL — required; fail loudly if absent so we never ship a
          # Windows build that cannot talk to a card (mirrors linux/macos).
          gh release download "${{ env.OPENCIE_PKCS11_VERSION }}" \
            --repo M0Rf30/opencie-pkcs11 \
            --pattern '*windows-x86_64*.dll' \
            --dir pkcs11-dist
          dll="$(ls pkcs11-dist/*.dll 2>/dev/null | head -1)"
          if [ -z "$dll" ]; then
            echo "::error::libopencie-pkcs11 windows-x86_64 .dll not found in M0Rf30/opencie-pkcs11 releases"
            exit 1
          fi
          cp "$dll" libopencie-pkcs11.dll
          echo "DLL downloaded: $(ls -lh libopencie-pkcs11.dll)"

          # Runtime deps the cross-built DLL links against — also required.
          gh release download "${{ env.OPENCIE_PKCS11_VERSION }}" \
            --repo M0Rf30/opencie-pkcs11 \
            --pattern 'windows-x86_64-runtime-deps*' \
            --dir pkcs11-runtime

      - name: Set PKCS11 lib path (windows)
        shell: bash
        run: echo "OPENCIE_PKCS11_LIB=$(pwd)/libopencie-pkcs11.dll" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: flutter build windows
        shell: bash
        run: flutter build windows --release

      - name: Verify PKCS#11 DLL was bundled
        shell: bash
        run: |
          test -f build/windows/x64/runner/Release/opencie-pkcs11.dll \
            || { echo "::error::opencie-pkcs11.dll missing from Windows Release dir"; exit 1; }

      - name: Copy runtime DLLs into release dir
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          # Copy runtime deps if we downloaded them
          if (Test-Path "pkcs11-runtime") {
            $dlls = Get-ChildItem "pkcs11-runtime\*.dll" -ErrorAction SilentlyContinue
            foreach ($dll in $dlls) {
              Copy-Item $dll.FullName -Destination $releaseDir -Force
            }
            Write-Host "Copied $($dlls.Count) runtime DLLs"
          }
          # List final contents
          Write-Host "=== Release directory ==="
          Get-ChildItem $releaseDir | Select-Object Name, Length | Format-Table

      - name: Generate Inno Setup wizard images
        shell: bash
        run: |
          set -euo pipefail
          # Regenerate Inno Setup wizard BMPs on every build so they stay in
          # sync with the brand palette colors (#0F1115/#181A21/#5B9DFF/
          # #FFAB40/#F5F6F8/#9097A6) and the current app icon. ImageMagick 7
          # ships preinstalled on windows-latest.
          ICON_SRC="windows/runner/resources/app_icon.ico"
          OUT="installer/assets"
          mkdir -p "$OUT"

          # Extract the largest frame from the multi-resolution .ico (256×256)
          # so we can scale it down cleanly with high quality filtering.
          magick "$ICON_SRC[0]" -resize 256x256 "$OUT/_logo.png"

          # ── Large left panel (164×314, 24-bit BMP) ────────────────────────
          # Vertical gradient #181A21 → #0F1115, logo 88×88 centered at top,
          # "OpenCIE" word-mark, gold accent bar, tagline.
          magick \
            -size 164x314 \
            "gradient:#181A21-#0F1115" \
            \( "$OUT/_logo.png" -resize 88x88 \) \
            -gravity North -geometry +0+42 -composite \
            -fill "#F5F6F8" -font Arial-Bold -pointsize 22 \
            -gravity North -annotate +0+150 "OpenCIE" \
            -fill "#9097A6" -font Arial -pointsize 11 \
            -gravity North -annotate +0+182 "v0.1.0" \
            -fill "#FFAB40" \
            -draw "rectangle 66,212 98,215" \
            -fill "#9097A6" -font Arial -pointsize 11 \
            -gravity North -annotate +0+232 "Firma e verifica" \
            -gravity North -annotate +0+250 "documenti CIE" \
            -type TrueColor -depth 8 -alpha off \
            BMP3:"$OUT/wizard_image.bmp"

          # ── Small top-right banner (55×55, 24-bit BMP) ────────────────────
          magick \
            -size 55x55 \
            "gradient:#181A21-#0F1115" \
            \( "$OUT/_logo.png" -resize 38x38 \) \
            -gravity Center -composite \
            -type TrueColor -depth 8 -alpha off \
            BMP3:"$OUT/wizard_small_image.bmp"

          rm -f "$OUT/_logo.png"
          echo "=== Generated wizard images ==="
          ls -la "$OUT/"
          file "$OUT/wizard_image.bmp" "$OUT/wizard_small_image.bmp"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          # JRSoftware migrated downloads to GitHub releases; the old
          # download.php/is.exe alias now redirects to an HTML page, not
          # the installer binary. Pull the exe directly from GitHub.
          $innoUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $innoUrl -OutFile innosetup.exe -MaximumRedirection 5
          Start-Process -FilePath .\innosetup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\InnoSetup' -Wait
          # Version comes from pubspec.yaml so the installer filename and the
          # Add/Remove Programs entry track the release instead of a hardcoded
          # literal in the .iss.
          $appVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if (-not $appVersion) { throw "could not read version from pubspec.yaml" }
          Write-Host "Installer version: $appVersion"
          & "C:\InnoSetup\ISCC.exe" "/DMyAppVersion=$appVersion" installer\opencie.iss
          Write-Host "=== Installer output ==="
          Get-ChildItem build\installer | Select-Object Name, Length | Format-Table

      - uses: actions/upload-artifact@v7
        with:
          name: opencie-windows-x86_64-setup
          path: build\installer\*.exe

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-build-log
          path: build\windows\

  macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache/hosted
          key: pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-cache-

      - name: Install runtime deps (Homebrew)
        run: |
          # Match the upstream libopencie-pkcs11 macOS build (M0Rf30/opencie-pkcs11
          # .github/workflows/main.yml) so every dylib referenced by otool -L
          # resolves on this runner. Adding/removing packages here without
          # checking that file will break the dylib bundling step below.
          # `tiff` was renamed away on Homebrew (now `largetifftools`); pulled in
          # transitively by podofo, so we don't request it explicitly.
          brew install \
            openssl@3 \
            curl \
            libxml2 \
            podofo \
            freetype \
            libpng \
            fontconfig \
            cryptopp \
            jpeg \
            openjpeg \
            imagemagick \
            create-dmg

      - name: Cache libopencie-pkcs11.dylib
        id: cache-pkcs11-macos
        uses: actions/cache@v6
        with:
          path: libopencie-pkcs11.dylib
          key: pkcs11-macos-arm64-${{ env.OPENCIE_PKCS11_VERSION }}

      - name: Download libopencie-pkcs11.dylib
        if: steps.cache-pkcs11-macos.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # TODO: verify native lib checksum once upstream publishes SHA256SUMS
          gh release download "${{ env.OPENCIE_PKCS11_VERSION }}" \
            --repo M0Rf30/opencie-pkcs11 \
            --pattern '*macos-arm64.dylib' \
            --dir pkcs11-dist
          if ls pkcs11-dist/*.dylib 2>/dev/null; then
            cp pkcs11-dist/*.dylib libopencie-pkcs11.dylib
            echo "DYLIB downloaded: $(ls -lh libopencie-pkcs11.dylib)"
          else
            echo "::error::libopencie-pkcs11.dylib not found in latest release"
            exit 1
          fi

      - name: Set PKCS11 lib path (macos)
        run: echo "OPENCIE_PKCS11_LIB=$(pwd)/libopencie-pkcs11.dylib" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: flutter build macos
        run: flutter build macos --release

      - name: Bundle dylib + brew deps into .app
        # macOS runners ship bash 3.2 by default — no associative arrays.
        # We already use the filesystem ($FRAMEWORKS/<name>) to dedupe copies,
        # so a bash-3-compatible script is enough.
        shell: bash
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/OpenCIE.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          EXE="$APP/Contents/MacOS/OpenCIE"
          mkdir -p "$FRAMEWORKS"

          # The Xcode "Copy Native Libraries" phase (driven by
          # $OPENCIE_PKCS11_LIB, set in the previous step) already bundles
          # the dylib; only copy it ourselves as a fallback so this step
          # still works if that phase didn't run.
          test -f "$FRAMEWORKS/libopencie-pkcs11.dylib" || cp libopencie-pkcs11.dylib "$FRAMEWORKS/"

          BREW_PREFIX="$(brew --prefix)"

          # Locates a Homebrew-provided dylib by basename across the layouts
          # a dependency can live in: (brew --prefix)/lib, keg-only opt/*/lib,
          # and the legacy /usr/local/lib. Always returns 0 — callers treat
          # empty stdout as "not found" and report the error themselves, so a
          # failed lookup here can never trip `set -e` and abort silently.
          find_in_brew() {
            local name="$1" cand
            for cand in \
              "$BREW_PREFIX/lib/$name" \
              "$BREW_PREFIX"/opt/*/lib/"$name" \
              "/usr/local/lib/$name"
            do
              [ -f "$cand" ] && { echo "$cand"; return 0; }
            done
            return 0
          }

          # Resolves an @rpath/@loader_path/@executable_path dependency of a
          # PREBUILT upstream dylib. Its LC_RPATH entries were baked in on
          # the opencie-pkcs11 build machine and don't exist on this runner,
          # so we read them back out of the dylib itself. Prints at most one
          # resolved path and always returns 0: a failed lookup is reported
          # by the caller (collect_deps), never by this function aborting,
          # so `set -e` can never turn "not found" into a silent exit before
          # the ::error:: diagnostic is printed.
          resolve_ref() {
            # $1 = referencing lib (real path); $2 = @rpath/... or @loader_path/... or @executable_path/... dep
            local reflib="$1" dep="$2" loaderdir suffix rp cand tmp
            loaderdir="$(cd "$(dirname "$reflib")" && pwd)"
            case "$dep" in
              @loader_path/*)
                cand="$loaderdir/${dep#@loader_path/}"
                [ -f "$cand" ] && echo "$cand"
                return 0
                ;;
              @executable_path/*)
                cand="$FRAMEWORKS/$(basename "$dep")"
                [ -f "$cand" ] && echo "$cand"
                return 0
                ;;
              @rpath/*)
                suffix="${dep#@rpath/}"
                ;;
              *)
                return 0
                ;;
            esac
            # Read LC_RPATH entries into a file and loop over the file (never
            # a pipe) so the loop runs in this shell, not a subshell — a
            # subshell `break` wouldn't stop the real loop and `echo`/`cand`
            # wouldn't survive back out anyway.
            tmp="$(mktemp)"
            otool -l "$reflib" | awk '/LC_RPATH/{f=1;next} f&&/ path /{print $2; f=0}' > "$tmp"
            while read -r rp; do
              case "$rp" in
                @loader_path*) rp="$loaderdir/${rp#@loader_path/}" ;;
                @executable_path*) rp="$loaderdir/${rp#@executable_path/}" ;;
              esac
              cand="$rp/$suffix"
              if [ -f "$cand" ]; then
                echo "$cand"
                break
              fi
            done < "$tmp"
            rm -f "$tmp"
            return 0
          }

          copy_and_recurse() {
            # $1 = real filesystem path to a dylib to bundle
            local src="$1" name
            name="$(basename "$src")"
            [ -f "$FRAMEWORKS/$name" ] && return 0
            cp "$src" "$FRAMEWORKS/"
            chmod 0644 "$FRAMEWORKS/$name"
            # Recurse on the ORIGINAL source path (never the copy) so each
            # lib's LC_RPATH/@loader_path deps still resolve — the copy lands
            # in Frameworks/ where those relative paths mean something else.
            collect_deps "$src"
          }

          # Writes one dependency per line to $2, minus the library's own
          # LC_ID_DYLIB: `otool -L` lists the install name first, and for the
          # prebuilt upstream dylib that is @rpath/libopencie-pkcs11.1.dylib —
          # a name that exists nowhere on disk, so treating it as a dependency
          # failed the whole step.
          dep_list() {
            local lib="$1" out="$2" id
            id="$(otool -D "$lib" | awk 'NR==2{print $1}')"
            otool -L "$lib" | tail -n +2 | awk '{print $1}' \
              | awk -v id="$id" 'id == "" || $0 != id' > "$out"
          }

          # Walks one dylib's `otool -L` output and bundles every non-system
          # dependency. Loops over a temp file (never a pipe) so the whole
          # walk runs in the CURRENT shell: an unresolved dep's `exit 1` must
          # abort this step, and the ::error:: line must actually reach the
          # log before that exit — both break if this were `... | while ...`.
          collect_deps() {
            local lib="$1" dep resolved tmp
            tmp="$(mktemp)"
            dep_list "$lib" "$tmp"
            while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*)
                  ;;
                /opt/homebrew/*|/usr/local/*|"$BREW_PREFIX"/*)
                  if [ -f "$dep" ]; then
                    copy_and_recurse "$dep"
                  else
                    resolved="$(find_in_brew "$(basename "$dep")")"
                    if [ -z "$resolved" ]; then
                      echo "::error::Missing Homebrew dylib: $dep (referenced by $lib). Add the matching package to the brew install step." >&2
                      exit 1
                    fi
                    copy_and_recurse "$resolved"
                  fi
                  ;;
                @rpath/*|@loader_path/*|@executable_path/*)
                  if [ ! -f "$FRAMEWORKS/$(basename "$dep")" ]; then
                    resolved="$(resolve_ref "$lib" "$dep")"
                    [ -z "$resolved" ] && resolved="$(find_in_brew "$(basename "$dep")")"
                    if [ -z "$resolved" ]; then
                      echo "::error::Unresolved dylib ref: $dep (referenced by $lib). Check LC_RPATH or add the matching Homebrew package." >&2
                      exit 1
                    fi
                    copy_and_recurse "$resolved"
                  fi
                  ;;
              esac
            done < "$tmp"
            rm -f "$tmp"
          }
          collect_deps "$FRAMEWORKS/libopencie-pkcs11.dylib"

          # Rewrite install_names: every bundled dylib's own id and all of its
          # /opt/homebrew or /usr/local references become @rpath/<name>.
          for f in "$FRAMEWORKS"/*.dylib; do
            name="$(basename "$f")"
            install_name_tool -id "@rpath/$name" "$f" || true
            otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              depname="$(basename "$dep")"
              case "$dep" in
                /opt/homebrew/*|/usr/local/*|"$BREW_PREFIX"/*)
                  install_name_tool -change "$dep" "@rpath/$depname" "$f" || true
                  ;;
                # @loader_path/../lib/<name> meant something on the Homebrew
                # side; inside Frameworks/ it points at Contents/lib. Rewrite
                # to @rpath whenever we bundled that name (plain
                # @loader_path/<name> already resolves to the sibling copy).
                @loader_path/*|@executable_path/*)
                  if [ "$dep" != "@loader_path/$depname" ] && [ -f "$FRAMEWORKS/$depname" ]; then
                    install_name_tool -change "$dep" "@rpath/$depname" "$f" || true
                  fi
                  ;;
              esac
            done
            # So the @rpath/<name> deps just rewritten above resolve to the
            # sibling copy in Frameworks/ — without this each dylib falls
            # back to searching its own baked LC_RPATH (e.g. /opt/homebrew/lib),
            # which is exactly why a local build kept loading libpng16/liblzma
            # straight from Homebrew instead of the bundled copies.
            install_name_tool -add_rpath "@loader_path" "$f" 2>/dev/null || true
          done

          # Ensure the executable can find @rpath in Frameworks/.
          # Flutter already adds @executable_path/../Frameworks; make sure.
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$EXE" 2>/dev/null || true

          # Every bundled dylib must now reference only the system, itself
          # via @loader_path/@executable_path, or another sibling via @rpath
          # that actually exists in Frameworks/ — i.e. nothing still points
          # at a Homebrew prefix that won't exist on an end-user's Mac. Check
          # this before signing so a broken bundle fails the build, not the
          # user's install.
          verify_failed=0
          for f in "$FRAMEWORKS"/*.dylib; do
            vtmp="$(mktemp)"
            dep_list "$f" "$vtmp"
            while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*)
                  ;;
                @rpath/*)
                  if [ ! -f "$FRAMEWORKS/$(basename "$dep")" ]; then
                    echo "::error::Unresolvable bundled reference: $dep (referenced by $f)" >&2
                    verify_failed=1
                  fi
                  ;;
                @loader_path/*)
                  if [ ! -f "$FRAMEWORKS/${dep#@loader_path/}" ]; then
                    echo "::error::Unresolvable bundled reference: $dep (referenced by $f)" >&2
                    verify_failed=1
                  fi
                  ;;
                @executable_path/*)
                  if [ ! -f "$APP/Contents/MacOS/${dep#@executable_path/}" ]; then
                    echo "::error::Unresolvable bundled reference: $dep (referenced by $f)" >&2
                    verify_failed=1
                  fi
                  ;;
                *)
                  echo "::error::Non-relocatable reference left in bundle: $dep (referenced by $f)" >&2
                  verify_failed=1
                  ;;
              esac
            done < "$vtmp"
            rm -f "$vtmp"
          done
          [ "$verify_failed" -eq 0 ] || exit 1

          # Ad-hoc codesign — required for Apple Silicon to load the bundled dylibs.
          codesign --force --deep --sign - "$APP"

          echo "=== Bundled Frameworks ==="
          ls -lh "$FRAMEWORKS"
          echo "=== App rpaths ==="
          otool -l "$EXE" | grep -A2 LC_RPATH || true
          echo "=== Verify codesign ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/installer

          # Build a .icns volume icon from the 1024px app icon so the mounted
          # DMG shows OpenCIE branding in Finder instead of the generic disk.
          ICON_SRC="macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png"
          ICONSET="build/installer/OpenCIE.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size      "$ICON_SRC" --out "$ICONSET/icon_${size}x${size}.png"      >/dev/null
            two=$((size * 2))
            sips -z $two  $two       "$ICON_SRC" --out "$ICONSET/icon_${size}x${size}@2x.png"   >/dev/null
          done
          iconutil -c icns "$ICONSET" -o build/installer/OpenCIE.icns
          rm -rf "$ICONSET"

           # DMG window background. Generated on the runner with
          # ImageMagick (preinstalled as `magick` on macos-latest) so we don't
          # have to commit a binary asset.
          # Window is 540x380 logical / 1080x760 @2x. Layout (logical coords):
          #   y=24    : 64x64 app logo, centered horizontally
          #   y=98    : "OpenCIE" word-mark
          #   y=128   : Italian subtitle "Trascina l'app sopra Applicazioni"
          #   y=270   : icons row (app on left @140, Applications drop @400)
          #   y=270   : blue arrow → between the icons
          # All ImageMagick coords below are in @2x pixel space (1080x760).
          BG_BASE="build/installer/dmg-bg.png"
          BG_2X="build/installer/dmg-bg@2x.png"
          # Use bundled Inter TTFs by absolute path. ImageMagick on macos-latest
          # can no longer resolve Helvetica via fontconfig and bundled fonts
          # match in-app branding anyway.
          INTER_BOLD="$(pwd)/assets/fonts/Inter-Bold.ttf"
          INTER_REGULAR="$(pwd)/assets/fonts/Inter-Regular.ttf"
          magick \
            -size 1080x760 \
            gradient:'#181A21'-'#0F1115' \
            \( "$ICON_SRC" -resize 128x128 \) -gravity North -geometry +0+48 -composite \
            -font "$INTER_BOLD" -pointsize 36 -fill '#F5F6F8' \
              -gravity North -annotate +0+196 'OpenCIE' \
            -font "$INTER_REGULAR" -pointsize 18 -fill '#9097A6' \
              -gravity North -annotate +0+256 'Trascina l'"'"'app sopra Applicazioni' \
            -fill none -stroke '#5B9DFF' -strokewidth 5 \
              -draw 'line 380,540 700,540' \
              -draw 'line 660,510 700,540' \
              -draw 'line 660,570 700,540' \
            "$BG_2X"
          # 540x380 fallback (older Finder / non-retina). create-dmg picks
          # the @2x automatically when both files exist with matching names.
          magick "$BG_2X" -resize 540x380 "$BG_BASE"

          create-dmg \
            --volname "OpenCIE" \
            --volicon build/installer/OpenCIE.icns \
            --background "$BG_BASE" \
            --window-size 540 380 \
            --icon-size 96 \
            --text-size 12 \
            --icon "OpenCIE.app" 140 270 \
            --app-drop-link 400 270 \
            --no-internet-enable \
            "build/installer/opencie-macos-arm64.dmg" \
            "build/macos/Build/Products/Release/OpenCIE.app"
          ls -lh build/installer/

      - uses: actions/upload-artifact@v7
        with:
          name: opencie-macos-arm64-dmg
          path: build/installer/*.dmg

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-build-log
          path: build/macos/

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: opencie-linux-x86_64
          path: flatpak/ci/bundle

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build single-file bundle
        run: |
          cd flatpak/ci
          cp ../flathub/io.github.m0rf30.opencie.desktop \
             ../flathub/io.github.m0rf30.opencie.metainfo.xml \
             ../flathub/io.github.m0rf30.opencie.png .
          flatpak-builder --user --force-clean --repo=fp-repo fp-build io.github.m0rf30.opencie.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            fp-repo "$GITHUB_WORKSPACE/opencie.flatpak" io.github.m0rf30.opencie
          ls -lh "$GITHUB_WORKSPACE/opencie.flatpak"

      - uses: actions/upload-artifact@v7
        with:
          name: opencie-flatpak
          path: opencie.flatpak

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [linux, android, windows, macos, flatpak]
    steps:
      - uses: actions/checkout@v7

      - name: Download linux artifact
        uses: actions/download-artifact@v8
        with:
          name: opencie-linux-x86_64
          path: dist/linux-x86_64

      - name: Download android artifact
        uses: actions/download-artifact@v8
        with:
          name: opencie-android-arm64-v8a
          path: dist/android

      - name: Download android aab
        uses: actions/download-artifact@v8
        with:
          name: opencie-android-aab
          path: dist/android-aab

      - name: Download windows installer
        uses: actions/download-artifact@v8
        with:
          name: opencie-windows-x86_64-setup
          path: dist/windows-setup

      - name: Download macos dmg
        uses: actions/download-artifact@v8
        with:
          name: opencie-macos-arm64-dmg
          path: dist/macos-dmg

      - name: Download flatpak bundle
        uses: actions/download-artifact@v8
        with:
          name: opencie-flatpak
          path: dist/flatpak

      - name: Stage release assets
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p release
          # Linux bundle tarball
          tar -czf release/opencie-${TAG}-linux-x86_64.tar.gz \
            -C dist/linux-x86_64 .
          # Android APK + AAB (already named with tag in the android job)
          cp dist/android/*.apk release/ 2>/dev/null || true
          cp dist/android-aab/*.aab release/ 2>/dev/null || true
          # Windows installer
          cp dist/windows-setup/*.exe release/ 2>/dev/null || true
          # macOS DMG (rename to include tag)
          for dmg in dist/macos-dmg/*.dmg; do
            [ -f "$dmg" ] || continue
            cp "$dmg" "release/opencie-${TAG}-macos-arm64.dmg"
          done
          # Flatpak single-file bundle
          cp dist/flatpak/*.flatpak "release/opencie-${TAG}-x86_64.flatpak" 2>/dev/null || true
          ls -lh release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            release/*
